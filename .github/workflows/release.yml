name: Build & Release Skill

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from SHA
        id: version
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Package skill
        run: |
          cd zh-article-analyzer
          zip -r ../zh-article-analyzer.zip .
          cd ..
          cp zh-article-analyzer.zip zh-article-analyzer.skill

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zh-article-analyzer-${{ steps.version.outputs.sha }}
          path: zh-article-analyzer.skill

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="v0.1.0-${SHORT_SHA}"
          cat > release-notes.md <<EOF
          ## zh-article-analyzer skill

          **Version:** \`${SHORT_SHA}\`
          **Commit:** ${GITHUB_SHA}

          ### Install

          \`\`\`bash
          npx skills add htlin222/zh-article-analyzer-skill
          \`\`\`

          Or download the \`.skill\` file from assets below.
          EOF
          gh release create "${TAG}" \
            --title "zh-article-analyzer skill ${TAG}" \
            --notes-file release-notes.md \
            zh-article-analyzer.skill
